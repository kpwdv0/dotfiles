set -g mouse on
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,xterm-ghostty:Tc"
set -sg escape-time 10
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g status-style "bg=default,fg=#8a8a8a"
set -g status-position bottom
set -g status-left ""
set -g status-right "#[fg=#5a5a5a]#S  #[fg=#8a8a8a]%H:%M "
set -g status-justify left

setw -g window-status-format         "#[fg=#5a5a5a] #I #W "
setw -g window-status-current-format "#[fg=#ffffff,bold] #I #W "
setw -g window-status-separator ""

set -g pane-border-style        "fg=#262626"
set -g pane-active-border-style "fg=#ffffff"

set -g message-style "bg=#000000,fg=#ffffff"
set -g mode-style    "bg=#262626,fg=#ffffff"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "reloaded"
